<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>ใบจัดอันดับปลา</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 8mm 8mm 10mm;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        color: #111827;
        margin: 0;
        padding: 0;
        background: #ffffff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .class-block {
        margin: 0;
      }
      .class-block.page-break {
        page-break-before: always;
      }
      .sheet-banner {
        margin-bottom: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #d1d5db;
      }
      .doc-title {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
        line-height: 1.3;
        color: #111827;
      }
      .meta {
        margin-top: 3px;
        font-size: 10px;
        color: #6b7280;
        line-height: 1.4;
      }
      .class-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 10px;
        padding: 0;
        background: transparent;
        border: none;
        color: #111827;
      }
      .class-head-title {
        font-size: 12px;
        font-weight: 700;
        line-height: 1.45;
      }
      .class-head-title .label {
        font-weight: 700;
      }
      .class-head-title .slug {
        font-weight: 500;
        color: #6b7280;
      }
      .class-head-meta {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 600;
        color: #4b5563;
        white-space: nowrap;
      }
      table.ranking-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 11px;
      }
      thead {
        display: table-header-group;
      }
      tbody {
        display: table-row-group;
      }
      tr {
        page-break-inside: avoid;
      }
      th,
      td {
        border: 1px solid #9ca3af;
        padding: 5px 6px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: #f3f4f6;
        color: #111827;
        font-weight: 700;
        font-size: 10.5px;
        text-align: center;
      }
      td {
        background: #ffffff;
        color: #111827;
        height: 30px;
      }
      .col-seq {
        width: 42px;
        text-align: center;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .col-name {
        width: 22%;
      }
      .col-order {
        width: 15%;
        font-size: 10px;
      }
      .col-code {
        width: 16%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        word-break: normal;
      }
      .col-rank {
        width: 72px;
        text-align: center;
      }
      .col-sign {
        width: 18%;
      }
      .blank-cell {
        background: #ffffff !important;
      }
      .blank-rank {
        min-height: 26px;
      }
      .blank-sign {
        min-height: 22px;
        margin: 2px 4px 0;
        border-bottom: 1px dotted #9ca3af;
      }
      .muted {
        color: #6b7280;
        font-size: 11px;
        text-align: center;
        padding: 14px;
      }
      .sheet-note {
        margin-top: 8px;
        font-size: 9.5px;
        color: #6b7280;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    {{body}}
  </body>
</html>
